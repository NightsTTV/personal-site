# NOTE: This site is deployed on Cloudflare Pages, not Netlify.
# This file is kept only for reference (build command, Node version pin).
# Cloudflare Pages SPA fallback is handled automatically by CF Workers Assets —
# no _redirects or _routes.json required for this site.
#
# If you ever migrate back to Netlify, the [[redirects]] block below handles
# React Router's client-side routes on direct load / refresh.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node >= 20.19 / 22.12; pin a known-good LTS.
  NODE_VERSION = "22"

# Netlify-only: SPA fallback rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
